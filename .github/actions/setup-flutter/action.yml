name: Set up Flutter dependencies
description: >-
  Restore the pub cache and fetch project dependencies with the lockfile
  enforced. The Flutter and Android SDKs are provided by the CI builder image
  (docker/flutter-build/Dockerfile), so this action does not download Flutter.

runs:
  using: composite
  steps:
    # GitHub container jobs use a runner-owned HOME, so the image build's
    # global Git configuration is not available at runtime.
    - name: Trust the Flutter SDK checkout
      shell: bash
      run: git config --global --add safe.directory /opt/flutter

    - name: Restore pub cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: pub-cache-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          pub-cache-${{ env.FLUTTER_VERSION }}-

    - name: Install dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile