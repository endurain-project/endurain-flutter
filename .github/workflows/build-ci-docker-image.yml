name: Build CI builder image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - docker/flutter-build/Dockerfile
      - android/gradle/wrapper/gradle-wrapper.properties
      - .github/workflows/build-ci-docker-image.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Published alongside this repository in GitHub Container Registry.
  IMAGE_NAME: ghcr.io/endurain-project/endurain-flutter-ci
  # Source of truth: .flutter-version (checked by ci.yml).
  IMAGE_TAG: '3.50.1'

jobs:
  build-image:
    name: Build and push builder image
    runs-on: ubuntu-latest
    # Downloads and verifies the Flutter and Android SDKs, then pushes.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          docker buildx build \
            --file docker/flutter-build/Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

      # The CI workflows pin the image by digest. After a rebuild, run
      #   .github/scripts/pin_ci_image_digest.sh <digest>
      # with the digest below and commit the three updated workflows.
      - name: Show the image digest
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/build-metadata.json")"
          {
            echo "### Builder image digest"
            echo
            echo "\`${IMAGE_NAME}:${IMAGE_TAG}@${digest}\`"
            echo
            echo "Pin it with \`.github/scripts/pin_ci_image_digest.sh ${digest}\`."
          } >> "$GITHUB_STEP_SUMMARY"