name: Integration

# On-device smoke tests (integration_test/) on an Android emulator. The iOS
# counterpart runs inside ios.yml, which already boots a simulator. The job runs
# in the CI builder image like ci.yml; the emulator additionally needs hardware
# acceleration, so /dev/kvm is passed through to the container.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "lib/**"
      - "android/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/integration.yml"

env:
  # Keep in sync with ci.yml.
  FLUTTER_VERSION: 3.47.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel verification of a commit that has landed on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

jobs:
  android-integration:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.47.3
      options: --device /dev/kvm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test
