name: Integration

# On-device smoke tests (integration_test/) on an Android emulator. The iOS
# counterpart runs inside ios.yml, which already boots a simulator. The emulator
# needs hardware acceleration, so unlike ci.yml this job cannot run in the CI
# builder container and uses a plain runner with Flutter installed.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "lib/**"
      - "android/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/integration.yml"

env:
  # Keep in sync with ci.yml.
  FLUTTER_VERSION: 3.47.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel verification of a commit that has landed on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  android-integration:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # The runner's /dev/kvm is owned by root; allow the runner user to use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test
