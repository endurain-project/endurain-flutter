name: Build Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name, for example 0.3.1
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
  release:
    types: [published]

env:
  # Source of truth: .flutter-version (checked by ci.yml).
  FLUTTER_VERSION: 3.50.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The build job runs third-party Gradle and pub plugin code next to the upload
# key, so it gets a read-only token. Only the release job below can write to
# the repository, and it never runs build code.
permissions:
  contents: read
  packages: read

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.50.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # Restore-only: this job signs the release, so it must never consume a
      # cache entry that a pull request run could have written. Entries come
      # from runs of the default branch (see the gradle-cache action).
      - name: Restore Gradle dependencies
        uses: ./.github/actions/gradle-cache
        with:
          save: 'false'

      - name: Prepare signed release inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            # Release tags mirror pubspec's `version:` field: vX.Y.Z+BUILD.
            tag="${RELEASE_TAG#v}"
            if [[ "$tag" != *+* ]]; then
              echo "Release tag '$RELEASE_TAG' must be vX.Y.Z+BUILD, for example v0.8.0+11." >&2
              exit 1
            fi
            VERSION_NAME="${tag%%+*}"
            VERSION_CODE="${tag##*+}"

            pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
            if [[ "$pubspec_version" != "$tag" ]]; then
              echo "Release tag '$tag' does not match pubspec.yaml version '$pubspec_version'." >&2
              exit 1
            fi
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
          fi

          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${ANDROID_UPLOAD_CERT_SHA256:?Missing ANDROID_UPLOAD_CERT_SHA256 secret}"

          keystore_path="$RUNNER_TEMP/endurain-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          expected_fingerprint="$(
            printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          )"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{64}$ ]]
          actual_fingerprint="$(
            keytool -list -v \
              -keystore "$keystore_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" 2>/dev/null |
              awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}'
          )"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]]

          # Only non-secret values go to later steps. The passwords and alias are
          # passed as step-level env to the two build steps that sign.
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "EXPECTED_CERT_SHA256=$expected_fingerprint"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=768m
            -XX:ReservedCodeCacheSize=128m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.workers.max=1
            -Dkotlin.compiler.execution.strategy=in-process
          JAVA_TOOL_OPTIONS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=768m
            -XX:ReservedCodeCacheSize=128m
          ENDURAIN_CRASH_REPORTING_DSN: ${{ vars.ENDURAIN_CRASH_REPORTING_DSN }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pkill -f 'GradleDaemon' || true
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --target-platform android-arm64 \
            --split-debug-info=build/debug-info \
            --dart-define=ENDURAIN_CRASH_REPORTING_DSN="${ENDURAIN_CRASH_REPORTING_DSN:-}"

      # The Wear OS app is a standalone Gradle build (android/wear), run with
      # the wrapper the phone build just generated. It gets the phone's version
      # name and build number; its version code adds 1,000,000 to the latter.
      - name: Build release Wear OS APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=768m
            -XX:ReservedCodeCacheSize=128m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.workers.max=1
            -Dkotlin.compiler.execution.strategy=in-process
          JAVA_TOOL_OPTIONS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=768m
            -XX:ReservedCodeCacheSize=128m
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pkill -f 'GradleDaemon' || true
          cd android
          ./gradlew -p wear assembleRelease --console=plain \
            -Pendurain.buildName="$VERSION_NAME" \
            -Pendurain.buildNumber="$VERSION_CODE"
          cp wear/build/outputs/apk/release/endurain-wear-release.apk \
            ../build/app/outputs/flutter-apk/wear-release.apk

      # The Wearable Data Layer only connects the two apps when both are
      # signed with the same key, so both must carry the upload certificate.
      - name: Verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          for apk_path in \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/wear-release.apk; do
            test -s "$apk_path"
            "$apksigner" verify --verbose --print-certs "$apk_path"
            actual_fingerprint="$(
              "$apksigner" verify --print-certs "$apk_path" |
                awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(":", "", $2); print toupper($2); exit}'
            )"
            [[ "$actual_fingerprint" == "$EXPECTED_CERT_SHA256" ]]
          done

      # Handed to the release job (a release run) or kept for download (a manual
      # run). Release runs keep it for a day only; 0 means the repository default.
      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endurain-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/wear-release.apk
          retention-days: ${{ github.event_name == 'release' && 1 || 0 }}
          if-no-files-found: error

  # Attaching needs a write token, so it is a separate job that only handles
  # the verified APKs and runs none of the build code.
  attach-release:
    name: Attach APKs to the release
    needs: build-android
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: endurain-release-apk
          path: apks

      # A rerun after a partial upload finds some APKs already attached, and
      # GitHub rejects a second asset with the same name. Replace them, so every
      # APK on the release comes from this run.
      - name: Attach APKs to the release
        shell: bash
        env:
          UPLOAD_URL: ${{ github.event.release.upload_url }}
          RELEASE_ID: ${{ github.event.release.id }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload_url="${UPLOAD_URL%%\{*}"
          releases_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          auth_headers=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer $TOKEN"
          )
          assets_json="$RUNNER_TEMP/release-assets.json"
          curl --fail --show-error --location "${auth_headers[@]}" \
            --output "$assets_json" \
            "$releases_api/$RELEASE_ID/assets?per_page=100"

          for apk_name in app-release.apk wear-release.apk; do
            existing_id="$(
              jq --raw-output --arg name "$apk_name" \
                '.[] | select(.name == $name) | .id' "$assets_json"
            )"
            if [[ -n "$existing_id" ]]; then
              echo "Replacing the existing $apk_name (asset $existing_id)."
              curl --fail --show-error --location "${auth_headers[@]}" \
                --request DELETE \
                "$releases_api/assets/$existing_id"
            fi
            curl --fail --show-error --location "${auth_headers[@]}" \
              --request POST \
              --header "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@apks/$apk_name" \
              "${upload_url}?name=$apk_name"
          done