name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # A full mirror push of a large history can be slow, but never this slow.
    timeout-minutes: 20
    steps:
      - name: Push full mirror to GitLab
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          # Credentials travel in an HTTP header passed per command (-c), so
          # they are never written to the mirror's git config or remote URLs.
          gh_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          gl_auth="$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$gh_auth"
          echo "::add-mask::$gl_auth"
          mirror_dir="$RUNNER_TEMP/endurain-flutter.git"
          git -c "http.extraheader=AUTHORIZATION: basic ${gh_auth}" \
            clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" "$mirror_dir"
          cd "$mirror_dir"
          # A plain `git push --mirror` would also push GitHub's refs/pull/*,
          # which GitLab rejects. Push only branches and tags, pruning
          # anything deleted upstream.
          git -c "http.extraheader=AUTHORIZATION: basic ${gl_auth}" \
            push --prune \
            "https://gitlab.com/endurain-project/endurain-flutter.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
