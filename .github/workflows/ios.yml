name: iOS

# macOS runners are the most expensive, so pull requests only run this when a
# change can break iOS or watchOS (the path filter below); every push to main
# runs it. Any other branch can be checked by hand from the Actions tab.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - .flutter-version
      # Native tests read the shared test vectors the Dart tests also use.
      - test/fixtures/**
      - integration_test/**
      - .github/workflows/ios.yml
  workflow_dispatch:

env:
  # Source of truth: .flutter-version (checked by ci.yml).
  FLUTTER_VERSION: 3.50.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel verification of a commit that has landed on main; a newer push
  # to a pull request supersedes the run for the older one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ios-test:
    name: iOS build and unit tests
    # macOS runners cannot use container jobs, so unlike ci.yml this job does
    # not use the CI builder image and checks out Flutter at the pinned version.
    # The Xcode 27 image (arm64 only): App Store uploads need the iOS 27 SDK
    # from April 2027, and the iOS 27.1+ SDK lets the app use the whole
    # iPhone Duo display. The macos-26 image only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The image defaults to an older Xcode 27; match the one releases are
      # built with. Selected first, since it decides which simulators exist.
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      # Cold-booting a simulator takes minutes on a fresh runner, so start it
      # now and let it boot while Flutter is installed and the app is built.
      # The iPhone Duo is preferred so the resizable foldable is what the
      # tests run on; otherwise any available iPhone, since runner images
      # change which simulators they ship.
      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r \
            '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
              | select(.name | startswith("iPhone"))]
              | (map(select(.name == "iPhone Duo")) + .)[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          echo "Using simulator $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          # Tags can be moved; the commit the tag pointed to when it was
          # reviewed is pinned here. Update it with
          # `git ls-remote https://github.com/flutter/flutter refs/tags/<version>`
          # whenever FLUTTER_VERSION changes.
          flutter_sha=ae9b586f34a8443573f82ef57c3bf914a908cbf7 # 3.50.1
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          actual_sha="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ "$actual_sha" != "$flutter_sha" ]]; then
            echo "Flutter $FLUTTER_VERSION is $actual_sha, expected $flutter_sha." >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Generate Xcode config
        shell: bash
        run: flutter build ios --simulator --debug --config-only

      - name: Run native XCTests
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO

      # The EndurainWatchTests target runs from the EndurainWatch scheme on a
      # watchOS simulator, picked by UDID like the iPhone above because runner
      # images change which watches they ship.
      - name: Run watchOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          watch_udid=$(xcrun simctl list devices available --json | jq -r \
            '[.devices | to_entries[] | select(.key | test("watchOS")) | .value[]
              | select(.name | startswith("Apple Watch"))][0].udid // empty')
          if [ -z "$watch_udid" ]; then
            echo "No Apple Watch simulator available" >&2
            exit 1
          fi
          echo "Using watch simulator $watch_udid"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme EndurainWatch \
            -destination "id=$watch_udid" \
            CODE_SIGNING_ALLOWED=NO

      # Boots the real app on the simulator and signs in against an in-process
      # fake server; the Android counterpart is integration.yml.
      - name: Run integration tests
        shell: bash
        # The suite itself takes under a minute, but the step also erases and
        # boots the simulator (~2 min) and rebuilds the app with its embedded
        # watch app (~4.5 min), so it needs about 9 minutes. A hung launch
        # must still fail well before the job timeout.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # xcodebuild test leaves the simulator in a used state (and can shut
          # it down). Start from a clean, booted one, as on a fresh install.
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl erase "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          # `flutter devices` also probes for wireless devices, which took
          # over three minutes on the runner; this only confirms the boot.
          xcrun simctl list devices booted
          flutter test integration_test -d "$SIMULATOR_UDID" --reporter expanded
