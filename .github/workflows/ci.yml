name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Source of truth: .flutter-version. The `versions` job fails when this, the
  # other workflows or the Dockerfile drift from it.
  FLUTTER_VERSION: 3.50.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel verification of a commit that has landed on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

jobs:
  versions:
    name: Version pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check Flutter version pins
        run: .github/scripts/check_flutter_version.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.50.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.50.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze Dart code
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.50.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run tests with coverage
        run: flutter test --coverage

      # Thresholds and the exclusion list (with rationale) are in
      # .github/scripts/check_coverage.sh and .github/coverage-excludes.txt.
      - name: Check coverage threshold
        run: .github/scripts/check_coverage.sh

  android-unit-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.50.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Cache Gradle dependencies
        uses: ./.github/actions/gradle-cache

      - name: Generate Gradle config
        shell: bash
        run: flutter build apk --config-only

      - name: Initialize Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android
          for attempt in 1 2 3; do
            if ./gradlew --version --console=plain; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "Gradle wrapper download attempt $attempt failed; retrying"
          done

      - name: Run native Kotlin unit tests
        shell: bash
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain

      # The default build links to the Wear OS app through
      # play-services-wearable; -Pendurain.wearable=false swaps in a stub.
      # Keep that stub compiling.
      - name: Compile without the Wear OS link
        shell: bash
        run: cd android && ./gradlew :app:compileDebugKotlin -Pendurain.wearable=false --console=plain

      # The Wear OS app is a standalone Gradle build (android/wear), so the
      # Flutter build never compiles it.
      - name: Build, test and lint the Wear OS app
        shell: bash
        run: cd android && ./gradlew -p wear assembleDebug testDebugUnitTest lintDebug --console=plain

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/endurain-project/endurain-flutter-ci:3.50.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Cache Gradle dependencies
        uses: ./.github/actions/gradle-cache

      # Debug signing keeps this gate safe for forks and pull requests.
      - name: Build debug APK
        shell: bash
        run: flutter build apk --debug --target-platform android-arm64
