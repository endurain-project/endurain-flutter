name: Build Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name, for example 0.3.1
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
  release:
    types:
      - published

permissions:
  # Needed so a `release: published` run can attach the APK to the release page.
  # Manual `workflow_dispatch` runs do not attach assets; they keep the
  # workflow-run artifact instead.
  contents: write

env:
  # Flutter version, used for the builder-image tag. Keep in sync with
  # docker/flutter-build/Dockerfile and build-ci-docker-image.yml.
  FLUTTER_VERSION: 3.44.6
  # Prebuilt Flutter + Android + JDK image (see build-ci-docker-image.yml).
  CI_IMAGE_BASE: codeberg.org/${{ forgejo.repository }}-ci

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:

  build-android:
    name: Build Android APK
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Prepare signed release inputs
        shell: bash
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          RELEASE_TAG: ${{ forgejo.event.release.tag_name }}
          RELEASE_ID: ${{ forgejo.event.release.id }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            VERSION_NAME="${RELEASE_TAG#v}"
            VERSION_CODE="$RELEASE_ID"
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
          fi

          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          : "${ANDROID_UPLOAD_CERT_SHA256:?Missing ANDROID_UPLOAD_CERT_SHA256 secret}"

          keystore_path="$RUNNER_TEMP/endurain-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          expected_fingerprint="$(
            printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          )"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{64}$ ]]
          actual_fingerprint="$(
            keytool -list -v \
              -keystore "$keystore_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" 2>/dev/null |
              awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}'
          )"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]]

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "EXPECTED_CERT_SHA256=$expected_fingerprint"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        # Build for arm64-v8a only. A fat APK runs gen_snapshot (the native Dart
        # AOT compiler, ~1.5-3 GB each) once per ABI, which OOM-kills the Gradle
        # daemon on the memory-constrained 8 GB runner. arm64-v8a covers
        # essentially all modern devices and keeps the output as app-release.apk.
        #
        # Memory tuning for a 6 GB, 4-vCPU runner:
        # - GRADLE_OPTS: caps main Gradle JVM to 1GB
        # - Kotlin compilation runs in-process with one Gradle worker
        # - JAVA_TOOL_OPTIONS: applies the same limits to lint worker JVMs
        # - --split-debug-info: reduces gen_snapshot memory by externalizing debug symbols
        env:
          GRADLE_OPTS: >-
            -Xmx1024m
            -XX:MaxMetaspaceSize=512m
            -XX:ReservedCodeCacheSize=128m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.workers.max=1
            -Dkotlin.compiler.execution.strategy=in-process
          JAVA_TOOL_OPTIONS: >-
            -Xmx1024m
            -XX:MaxMetaspaceSize=512m
            -XX:ReservedCodeCacheSize=128m
        run: |
          # Stop any stale Gradle daemons
          pkill -f 'GradleDaemon' || true
          # Build with split debug info to reduce gen_snapshot memory
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --target-platform android-arm64 \
            --split-debug-info=build/debug-info

      - name: Verify signed APK
        shell: bash
        env:
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$APK_PATH"
          actual_fingerprint="$(
            "$apksigner" verify --print-certs "$APK_PATH" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(":", "", $2); print toupper($2); exit}'
          )"
          [[ "$actual_fingerprint" == "$EXPECTED_CERT_SHA256" ]]

      # For manual builds there is no release to attach to, so keep the APK as a
      # workflow-run artifact for download/inspection.
      - name: Upload APK as workflow artifact
        if: forgejo.event_name == 'workflow_dispatch'
        # Codeberg's Forgejo artifact backend is detected as GHES by
        # @actions/artifact. upload-artifact v4+ (which bundles @actions/artifact
        # v2) hard-fails on GHES with "GHESNotSupportedError", so we must use the
        # v3 line (@actions/artifact v1). v3-node20 is the v3 build rebuilt to run
        # on Node 20 instead of the deprecated Node 16.
        uses: https://data.forgejo.org/forgejo/upload-artifact@97a0fba1372883ab732affbe8f94b823f91727db # v3-node20
        with:
          name: endurain-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # For published releases, attach the APK directly to the release page so
      # users can download it without digging through CI runs.
      - name: Attach APK to the release
        if: forgejo.event_name == 'release'
        shell: bash
        # The token and release id come from the event context; the APK is sent
        # as a multipart attachment to the Forgejo release-assets API.
        env:
          API_URL: ${{ forgejo.api_url }}
          REPOSITORY: ${{ forgejo.repository }}
          RELEASE_ID: ${{ forgejo.event.release.id }}
          TOKEN: ${{ forgejo.token }}
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
        run: |
          set -euo pipefail
          curl --fail --show-error --location \
            --request POST \
            --header "Authorization: token $TOKEN" \
            --form "attachment=@${APK_PATH}" \
            "${API_URL}/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=app-release.apk"
