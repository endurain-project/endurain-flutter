name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

env:
  # Flutter version, used for the builder-image tag and the pub cache key. Keep
  # in sync with docker/flutter-build/Dockerfile and build-image.yml.
  FLUTTER_VERSION: 3.44.1
  # Prebuilt Flutter + Android + JDK image (see build-image.yml). The Flutter and
  # Android SDKs are baked in, so the jobs only restore the pub cache.
  CI_IMAGE_BASE: codeberg.org/${{ forgejo.repository }}-ci

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  # Cancel superseded runs while iterating on a PR, but never cancel a run on
  # master: every commit that lands on the always-deployable branch must be
  # verified end-to-end.
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/master' }}

jobs:

  format:
    name: Format
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Analyze Dart code
        run: flutter analyze

  test:
    name: Test
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: >-
          dart run tool/check_coverage.dart
          --min-line-coverage 80
          --min-file-line-coverage 60
          --exclude 'lib/l10n/app_localizations*.dart'
          --exclude 'lib/core/theme/app_theme_tokens.dart'
          --exclude 'lib/core/navigation/app_routes.dart'
          --exclude 'lib/shared/widgets/app_bottom_nav.dart'
          --exclude 'lib/core/services/location_platform_adapter.dart'
          --exclude 'lib/core/services/multipart_upload_adapter.dart'
          --exclude 'lib/core/services/package_info_service.dart'
          --exclude 'lib/core/services/url_launcher_service.dart'
