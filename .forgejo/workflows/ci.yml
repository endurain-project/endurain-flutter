name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

env:
  # Flutter version, used for the builder-image tag and the pub cache key. Keep
  # in sync with docker/flutter-build/Dockerfile and build-ci-docker-image.yml.
  FLUTTER_VERSION: 3.44.6
  # Prebuilt Flutter + Android + JDK image (see build-image.yml). The Flutter and
  # Android SDKs and NDK are baked in, so the jobs only restore the pub cache.
  CI_IMAGE_BASE: codeberg.org/${{ forgejo.repository }}-ci

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  # Cancel superseded runs while iterating on a PR, but never cancel a run on
  # main: every commit that lands on the always-deployable branch must be
  # verified end-to-end.
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:

  format:
    name: Format
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Analyze Dart code
        run: flutter analyze

  test:
    name: Test
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: >-
          dart run tool/check_coverage.dart
          --min-line-coverage 80
          --min-file-line-coverage 60
          --exclude 'lib/l10n/app_localizations*.dart'
          --exclude 'lib/core/theme/app_theme_tokens.dart'
          --exclude 'lib/core/navigation/app_routes.dart'
          --exclude 'lib/shared/widgets/app_bottom_nav.dart'
          --exclude 'lib/core/services/platform/*.dart'
          --exclude 'lib/features/health/services/health_package_platform_adapter.dart'
          --exclude 'lib/features/sensors/services/universal_ble_sensor_connection_adapter.dart'

  android-unit-test:
    name: Android unit tests
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Generate Gradle config
        shell: bash
        # Writes android/local.properties (Flutter + Android SDK paths) so the
        # Gradle wrapper can resolve the Flutter plugin without a full build.
        run: flutter build apk --config-only

      - name: Run native (Kotlin) unit tests
        shell: bash
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain

  # Compile verification for the native layer.
  #
  # `analyze` and `test` only cover Dart: neither compiles Kotlin, evaluates the
  # Gradle configuration, nor links the Android app. Without this job a change
  # to android/**, the manifest, or a Gradle script can break the build while
  # CI stays green.
  #
  # KNOWN GAP — iOS is not verified here. Building iOS and running the XCTest
  # suite both require a macOS runner, which this project does not have. So:
  #   - Swift changes and edits to ios/Runner.xcodeproj are NOT checked by CI.
  #     Build them locally with `flutter build ios --simulator --debug` before
  #     opening a PR that touches ios/**.
  #   - The tests in ios/RunnerTests never run automatically. Run them from
  #     Xcode when changing ios/Runner/Activity/**.
  # Revisit if a macOS runner becomes available.
  android-build:
    name: Android build
    runs-on: local-runner
    container:
      image: ${{ env.CI_IMAGE_BASE }}:${{ env.FLUTTER_VERSION }}
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Build debug APK
        shell: bash
        # Debug signing only: the release-signing guard in
        # android/app/build.gradle.kts is gated on a release task, so this needs
        # no keystore credentials and works on forks and PRs from contributors.
        run: flutter build apk --debug

