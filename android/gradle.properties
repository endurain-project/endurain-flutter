# Memory tuning for constrained CI containers (host ~8 GB, Docker less).
# Several JVMs run concurrently during an Android build: the Gradle daemon,
# a separate Kotlin compiler daemon, and R8. Keep each heap small and avoid
# running them in parallel so their combined footprint stays within the
# container's memory limit and the kernel OOM-killer does not terminate the
# daemon ("Gradle build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Cap the (separate) Kotlin compiler daemon JVM.
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=256m
# Do not run tasks/modules in parallel; limit worker JVMs to one at a time.
org.gradle.parallel=false
org.gradle.workers.max=1
# Avoid an extra long-lived daemon JVM hanging around in single-use CI builds.
org.gradle.daemon=false
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
