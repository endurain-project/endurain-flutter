# Memory tuning for constrained CI containers (host ~6 GB, shared with the OS,
# Docker daemon and runner agent). A Flutter release build also runs
# gen_snapshot, the native Dart AOT compiler, once per target ABI; each
# instance can use 1.5-3 GB of NON-JVM memory. gen_snapshot runs to completion
# and exits BEFORE Gradle starts, so it never competes with the JVM heap
# below. With org.gradle.daemon=false, this JVM (not GRADLE_OPTS/
# JAVA_TOOL_OPTIONS) is what actually executes the build, including R8
# minification, which runs in-process (no isolated worker). 1024m was too
# small and OOM'd on minifyReleaseWithR8 ("R8: java.lang.OutOfMemoryError:
# Java heap space"); keep this in sync with the Xmx used in
# .forgejo/workflows/build-android-apk.yml's "Build release APK" step.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Run Kotlin compiler in the same JVM as Gradle (no separate daemon process).
kotlin.compiler.execution.strategy=in-process
# Do not run tasks/modules in parallel; limit worker JVMs to one at a time.
org.gradle.parallel=false
org.gradle.workers.max=1
# Avoid an extra long-lived daemon JVM hanging around in single-use CI builds.
org.gradle.daemon=false
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
