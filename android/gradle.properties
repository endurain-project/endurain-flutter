# Memory tuning for constrained CI containers (host ~8 GB, shared with the OS,
# Docker daemon and runner agent). Besides the JVMs (Gradle daemon, Kotlin
# compiler daemon, R8), a Flutter release build also runs gen_snapshot, the
# native Dart AOT compiler, once per target ABI; each instance can use 1.5-3 GB
# of NON-JVM memory. Keep the JVM heaps small so there is headroom for
# gen_snapshot, otherwise the kernel OOM-killer terminates the daemon
# ("Gradle build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Cap the (separate) Kotlin compiler daemon JVM.
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m
# Do not run tasks/modules in parallel; limit worker JVMs to one at a time.
org.gradle.parallel=false
org.gradle.workers.max=1
# Avoid an extra long-lived daemon JVM hanging around in single-use CI builds.
org.gradle.daemon=false
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
