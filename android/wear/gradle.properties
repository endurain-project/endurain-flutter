# Mirrors android/gradle.properties for the standalone Wear OS build, except
# android.builtInKotlin/android.newDsl: the phone build keeps the legacy
# settings for the Flutter Gradle plugin, which this build does not use.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
android.useAndroidX=true
