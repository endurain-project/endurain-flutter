name: endurain
description: "Endurain mobile app for Android and iOS"
publish_to: 'none'

# Release tags mirror this field (vX.Y.Z+BUILD); the Android workflow checks it.
# `flutter build --build-name/--build-number` override it per build.
version: 0.12.4+26

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned to the version bundled with the Flutter SDK's flutter_localizations
  # so a transitive resolution cannot pull a breaking intl.
  intl: ^0.20.2

  # Dart-team stream/async utilities. Used for StreamGroup.merge to fan the
  # per-kind external-sensor streams into the single recording pipeline.
  async: ^2.13.0

  cupertino_icons: ^2.0.0

  # Secure storage for credentials
  flutter_secure_storage: ^11.1.0

  # Map with OpenStreetMap
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Location services
  geolocator: ^14.0.3

  # Package info for app version
  package_info_plus: ^10.2.1

  # OS version and device model for the local diagnostics report header.
  # BSD-3-Clause, no Google Play Services, no extra Android permissions. Only
  # an allowlist of fields is read (see DeviceInfoService); never the device
  # name or identifiers.
  device_info_plus: ^13.3.0

  # Local app-support storage for privacy-safe diagnostics
  path_provider: ^2.1.6

  # Non-secret key/value storage for display and language preferences.
  shared_preferences: ^2.5.5

  # Floor for the transitive Android implementation. 2.5.0-2.5.1 break release
  # builds (R8 renames the Kotlin classes called over JNI;
  # flutter/flutter#194649); 2.5.2 ships its own consumer rules. Do not lower.
  shared_preferences_android: ^2.5.2

  # HTTP client for API requests
  http: ^1.2.2

  # Crypto utilities for PKCE
  crypto: ^3.0.6

  # Opt-in remote crash/error reporting. The pure-Dart Sentry SDK speaks the
  # Sentry protocol used by the managed Endurain diagnostics endpoint. The
  # Flutter-specific `sentry_flutter` package is intentionally NOT used: it is
  # currently held back to an old major on this dependency set, whereas the
  # pure-Dart package resolves to the latest and captures the same Dart/Flutter
  # errors the local diagnostics recorder already hooks. Native-crash capture
  # can be added later by swapping the injected CrashReporter adapter.
  sentry: ^10.1.0

  # System browser OAuth/SSO flow with deep-link callback
  app_links: ^7.2.1
  url_launcher: ^6.3.1

  # SVG support for SSO provider icons
  flutter_svg: ^2.5.1

  # SQLite storage for local activity metadata.
  # sqflite provides the native Android/iOS implementation.
  sqflite: ^2.4.4

  # Network connectivity signal for retrying activity uploads when connectivity
  # returns.
  connectivity_plus: ^7.3.2

  # OS share sheet for GPX file export.
  share_plus: ^13.2.1

  # Declarative, deep-link-ready routing for top-level auth-guarded navigation.
  go_router: ^18.0.1

  # Health platform sync: HealthKit (iOS) + Health Connect (Android).
  health: ^14.0.0

  # BLE access for external sensors (heart-rate straps, etc.).
  # universal_ble is BSD-3-Clause (FOSS, F-Droid compatible, no Google Play
  # Services) and actively maintained across Android/iOS/desktop/web. It also
  # requests the BLE runtime permissions itself, so no separate
  # permission_handler dependency is needed.
  universal_ble: ^3.4.1

  # Standalone Material/Cupertino design packages (Flutter 3.47+), decoupled
  # from the core SDK so they can ship on their own release cadence.
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2

dev_dependencies:
  analyzer: ^13.0.0
  path: ^1.9.1
  fake_async: ^1.3.3

  # In-memory shared-preferences platform implementation for router tests.
  shared_preferences_platform_interface: ^2.4.2

  # In-process SQLite (MIT) for unit tests, so the activity store can run
  # without platform channels. Not shipped in the app.
  sqflite_common_ffi: ^2.4.3

  flutter_test:
    sdk: flutter

  # On-device smoke tests under integration_test/ (run in CI on an emulator).
  integration_test:
    sdk: flutter

  # Lint set activated in analysis_options.yaml.
  flutter_lints: ^6.0.0

  # Generate app icons for all platforms
  flutter_launcher_icons: ^0.14.4

# geolocator_linux 0.2.6, the latest, still requires dbus ^0.7, which blocks
# universal_ble >=3.1.1 and connectivity_plus >=7.3.2 (both need dbus ^0.8).
# The app builds only for Android and iOS, so geolocator_linux is never built
# into it. Remove this once a geolocator_linux release accepts dbus ^0.8.
dependency_overrides:
  dbus: ^0.8.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/logo/brand_logo_light_theme.png
    - assets/logo/brand_logo_dark_theme.png
    - assets/sso/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/brand_logo_light_theme.png"
  adaptive_icon_background: "#19AB88"
  # Transparent-background glyph; the opaque square would turn the Android 13+
  # themed icon into a solid tile. Regenerating also writes
  # ic_launcher_monochrome (white silhouette) for the themed icon.
  adaptive_icon_foreground: "assets/logo/brand_logo_foreground.png"
  adaptive_icon_monochrome: "assets/logo/brand_logo_monochrome.png"
  image_path_ios_dark_transparent: "assets/logo/brand_logo_dark_theme.png"
  image_path_ios_tinted_grayscale: "assets/logo/brand_logo_light_theme.png"
  desaturate_tinted_to_grayscale_ios: true
  min_sdk_android: 26

