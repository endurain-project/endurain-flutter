name: endurain
description: "Endurain tracking mobile app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.7.1+8

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned to the version bundled with the Flutter SDK's flutter_localizations
  # so a transitive resolution cannot pull a breaking intl.
  intl: ^0.20.2

  # Dart-team stream/async utilities. Used for StreamGroup.merge to fan the
  # per-kind external-sensor streams into the single recording pipeline.
  async: ^2.13.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Secure storage for credentials
  flutter_secure_storage: ^10.0.0

  # Map with OpenStreetMap
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Location services
  geolocator: ^14.0.3

  # Package info for app version
  package_info_plus: ^10.2.1

  # Local app-support storage for privacy-safe diagnostics
  path_provider: ^2.1.6

  # Non-secret key/value storage for display and language preferences.
  shared_preferences: ^2.5.5

  # HTTP client for API requests
  http: ^1.2.2

  # Crypto utilities for PKCE
  crypto: ^3.0.6

  # Opt-in remote crash/error reporting. The pure-Dart Sentry SDK speaks the
  # Sentry protocol used by the managed Endurain diagnostics endpoint. The
  # Flutter-specific `sentry_flutter` package is intentionally NOT used: it is
  # currently held back to an old major on this dependency set, whereas the
  # pure-Dart package resolves to the latest and captures the same Dart/Flutter
  # errors the local diagnostics recorder already hooks. Native-crash capture
  # can be added later by swapping the injected CrashReporter adapter.
  sentry: ^9.24.0

  # System browser OAuth/SSO flow with deep-link callback
  app_links: ^7.2.1
  url_launcher: ^6.3.1

  # SVG support for SSO provider icons
  flutter_svg: ^2.0.16

  # SQLite storage for local activity metadata.
  # sqflite provides the native Android/iOS implementation.
  sqflite: ^2.4.0

  # Network connectivity signal for retrying activity uploads when connectivity
  # returns.
  connectivity_plus: ^7.3.0

  # OS share sheet for GPX file export.
  share_plus: ^13.2.1

  # Declarative, deep-link-ready routing for top-level auth-guarded navigation.
  go_router: ^17.3.0

  # Health platform sync: HealthKit (iOS) + Health Connect (Android).
  health: ^13.3.1

  # BLE access for external sensors (heart-rate straps, etc.).
  # universal_ble is BSD-3-Clause (FOSS, F-Droid compatible, no Google Play
  # Services) and actively maintained across Android/iOS/desktop/web. It also
  # requests the BLE runtime permissions itself, so no separate
  # permission_handler dependency is needed.
  universal_ble: ^2.1.0

dev_dependencies:
  fake_async: ^1.3.3

  # In-memory shared-preferences platform implementation for router tests.
  shared_preferences_platform_interface: ^2.4.2

  # In-process SQLite (MIT) for unit tests, so the activity store can run
  # without platform channels. Not shipped in the app.
  sqflite_common_ffi: ^2.4.2

  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generate app icons for all platforms
  flutter_launcher_icons: ^0.14.4

# health ^13.3.1 constrains device_info_plus to ^12.1.0. Override it until
# health accepts version 13, which supports Flutter 3.44's built-in Kotlin.
dependency_overrides:
  device_info_plus: ^13.2.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo/brand_logo_light_theme.png
    - assets/logo/brand_logo_dark_theme.png
    - assets/sso/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/brand_logo_light_theme.png"
  adaptive_icon_background: "#19AB88"
  adaptive_icon_foreground: "assets/logo/brand_logo_light_theme.png"
  image_path_ios_dark_transparent: "assets/logo/brand_logo_dark_theme.png"
  image_path_ios_tinted_grayscale: "assets/logo/brand_logo_light_theme.png"
  desaturate_tinted_to_grayscale_ios: true
  min_sdk_android: 26

